[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent"
version = "0.1.0"
description = "Windows-first personal automation agent with local LLM and Telegram control."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.7",
  "httpx>=0.28.1",
  "python-telegram-bot>=22.3",
  "faster-whisper>=1.2.0",
  "google-api-python-client>=2.178.0",
  "google-auth-oauthlib>=1.2.2",
  "chromadb>=1.0.16",
  "pyyaml>=6.0.2",
  "pyautogui>=0.9.54",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.1", "ruff>=0.12.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["brain*", "bot*", "config*", "connector*", "skills*"]
